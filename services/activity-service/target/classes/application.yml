server: { port: 8083 }
spring:
  application: { name: activity-service }
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/progressly}
    username: ${DATABASE_USERNAME:progressly}
    password: ${DATABASE_PASSWORD:progressly_dev}
  jpa: { hibernate: { ddl-auto: update }, open-in-view: false }
eureka: { client: { service-url: { defaultZone: http://localhost:8761/eureka/ } } }
management: { endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } } }
springdoc: { api-docs: { path: /v3/api-docs }, swagger-ui: { path: /swagger-ui.html } }
progressly: { security: { jwt-secret: ${JWT_SECRET:replace-with-a-development-secret-at-least-32-characters} } }
